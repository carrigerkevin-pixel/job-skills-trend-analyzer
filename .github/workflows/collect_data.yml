name: Collect Job Data

on:
  schedule:
    - cron: "0 13 * * 1"  # Every Monday at 1:00 PM UTC
  workflow_dispatch:  # Also allows manually triggering it from GitHub's UI

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data folder exists
        run: mkdir -p data

      - name: Initialize database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/init_db.py

      - name: Run data collection
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/collect_jobs.py

      - name: Run skill extraction
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/run_extraction.py

      - name: Save trend snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/analysis.py