name: Collect Job Data

on:
  schedule:
    - cron: "0 13 * * 1"  # Every Monday at 1:00 PM UTC
  workflow_dispatch:  # Also allows manually triggering it from GitHub's UI

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data folder exists
        run: mkdir -p data

      - name: Initialize database
        run: python pipeline/init_db.py

      - name: Run data collection
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python pipeline/collect_jobs.py

      - name: Run skill extraction
        run: python pipeline/run_extraction.py

      - name: Save trend snapshot
        run: python pipeline/analysis.py

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs.db
          git commit -m "Automated data collection $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push